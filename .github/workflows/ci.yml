name: Java CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Show tool versions (debug)
        run: |
          java -version
          mvn -v
          google-chrome --version || true
          chromedriver --version || true

      - name: Install Xvfb (for GUI tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Maven tests (Xvfb)
        run: |
          xvfb-run --auto-servernum mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/**
            test-output/**
          if-no-files-found: warn

      - name: Archive build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/.m2/repository/**
          if-no-files-found: warn
