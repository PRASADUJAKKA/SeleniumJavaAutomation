name: Java CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Show tool versions
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Maven:"
          mvn -version

          echo ""
          echo "Chrome:"
          google-chrome --version || true

          echo ""
          echo "ChromeDriver:"
          chromedriver --version || true

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Maven tests
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            target/surefire-reports/**
            test-output/**
          if-no-files-found: warn

      - name: Archive Maven logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: |
            ~/.m2/repository/**
          if-no-files-found: warn
